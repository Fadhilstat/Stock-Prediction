[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruang-risiko-idx"
version = "0.1.0"
description = "Dashboard edukasi risiko saham Indonesia dengan GARCH, Kronos, dan TTM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=25,<26",
  "pyyaml>=6,<7",
  "streamlit>=1.60,<2",
  "yfinance>=1.5,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
models = [
  "arch>=7,<9",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
