name: Refresh deployment bundle

on:
  schedule:
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployment-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[models]"

      - name: Refresh market data
        run: python scripts/update_market_data.py

      - name: Build analytics
        run: python scripts/build_analytics_dataset.py

      - name: Build GARCH risk snapshot
        run: python scripts/build_latest_risk_snapshot.py

      - name: Build direction snapshot
        run: python scripts/build_latest_direction_snapshot.py

      - name: Build deployment bundle
        run: python scripts/build_deployment_bundle.py

      - name: Validate deployment bundle
        run: |
          python -c "from pathlib import Path; from ruang_risiko_idx.dashboard.deployment import load_deployment_dashboard_data; load_deployment_dashboard_data(Path('.')); print('Deployment bundle validation: PASS')"

      - name: Commit validated bundle when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment/
          if git diff --cached --quiet; then
            echo "Deployment bundle is unchanged."
          else
            git commit -m "Refresh dashboard deployment bundle"
            git push
          fi
