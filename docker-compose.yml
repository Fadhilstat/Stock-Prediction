services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruang_risiko_idx_app
    restart: unless-stopped
    environment:
      - PORT=8501
      - HOST=0.0.0.0
      - ENABLE_AUTO_POLLER=1
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./reports:/app/reports
    ports:
      - "127.0.0.1:8501:8501"
    expose:
      - "8501"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: rridx_network
