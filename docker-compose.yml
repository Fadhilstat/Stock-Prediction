services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ruang_risiko_idx_app
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    expose:
      - "8501"
    networks:
      - rridx_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    container_name: ruang_risiko_idx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${CUSTOM_DOMAIN:-rridx.fadhilrusydi.com}
      - TLS_EMAIL=${TLS_EMAIL:-admin@fadhilrusydi.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - rridx_network

volumes:
  caddy_data:
  caddy_config:

networks:
  rridx_network:
    driver: bridge
